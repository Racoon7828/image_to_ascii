<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>ASCII Art Converter</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: #111;
  color: #ddd;
  font-family: 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

header {
  padding: 12px 20px;
  background: #1c1c1c;
  border-bottom: 1px solid #2a2a2a;
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
header h1 { font-size: 1rem; color: #fff; white-space: nowrap; }

.controls {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  flex: 1;
}
.ctrl { display: flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #aaa; }
.ctrl input[type=range] { width: 90px; accent-color: #4af; }
.ctrl-val { color: #4af; min-width: 30px; font-size: 0.8rem; }
.ctrl input[type=checkbox] { accent-color: #4af; width: 14px; height: 14px; cursor: pointer; }

.btn { padding: 5px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
.btn-ghost { background: #2a2a2a; color: #ccc; }
.btn:hover  { opacity: 0.85; }

#drop-zone {
  margin: 16px;
  border: 2px dashed #333;
  border-radius: 10px;
  padding: 32px;
  text-align: center;
  cursor: pointer;
  transition: border-color 0.2s, background 0.2s;
  flex-shrink: 0;
}
#drop-zone.drag-over { border-color: #4af; background: #1a2a3a; }
#drop-zone p { color: #666; font-size: 0.9rem; }
#drop-zone p span { color: #4af; }
#file-input { display: none; }

#output-wrap {
  flex: 1;
  overflow: auto;
  background: #000;
  padding: 8px;
}
#output {
  font-family: 'Courier New', monospace;
  font-size: 10px;
  line-height: 1.15;
  white-space: pre;
  color: #fff;
}

#seek-bar {
  display: none;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  background: #1c1c1c;
  border-top: 1px solid #2a2a2a;
}
#seek-bar input[type=range] {
  flex: 1;
  accent-color: #4af;
  height: 4px;
  cursor: pointer;
}
#seek-time {
  font-size: 0.75rem;
  color: #666;
  white-space: nowrap;
}
.vid-btn {
  background: none;
  border: none;
  color: #aaa;
  font-size: 1.1rem;
  cursor: pointer;
  padding: 0 4px;
  line-height: 1;
}
.vid-btn:hover { color: #fff; }

#status {
  padding: 4px 16px;
  font-size: 0.75rem;
  color: #555;
  background: #1c1c1c;
  border-top: 1px solid #2a2a2a;
  height: 22px;
}

/* 프레임 추출용 오프스크린 캔버스 */
canvas, video, img { display: none; }
</style>
</head>
<body>

<header>
  <h1>ASCII Art</h1>
  <div class="controls">
    <div class="ctrl">
      너비 <input type="range" id="c-width" min="40" max="300" value="100">
      <span class="ctrl-val" id="v-width">100</span>
    </div>
    <div class="ctrl">
      대비 <input type="range" id="c-contrast" min="0.5" max="5" step="0.1" value="2.5">
      <span class="ctrl-val" id="v-contrast">2.5</span>
    </div>
    <div class="ctrl">
      폰트비율 <input type="range" id="c-ratio" min="0.3" max="0.7" step="0.01" value="0.45">
      <span class="ctrl-val" id="v-ratio">0.45</span>
    </div>
    <div class="ctrl">
      엣지 <input type="range" id="c-edge" min="0" max="150" value="50">
      <span class="ctrl-val" id="v-edge">50</span>
    </div>
    <div class="ctrl">
      크기 <input type="range" id="c-size" min="4" max="20" value="10">
      <span class="ctrl-val" id="v-size">10</span>px
    </div>
    <div class="ctrl">반전 <input type="checkbox" id="c-invert" checked></div>
    <div class="ctrl">컬러 <input type="checkbox" id="c-color"></div>
    <button class="btn btn-ghost" onclick="downloadTxt()">TXT</button>
    <button class="btn btn-ghost" onclick="downloadHtml()">HTML</button>
    <button class="btn btn-ghost" id="btn-save-video" style="display:none" onclick="saveVideo()">영상 저장</button>
  </div>
</header>

<div id="drop-zone">
  <p>이미지 / GIF / 영상을 드래그하거나 <span>클릭</span>하여 선택</p>
  <p style="margin-top:6px; font-size:0.75rem">JPG · PNG · GIF · MP4 · WEBM</p>
  <input type="file" id="file-input" accept="image/*,video/*">
</div>

<div id="seek-bar">
  <button class="vid-btn" id="btn-playpause" onclick="togglePause()">⏸</button>
  <button class="vid-btn" id="btn-stop"      onclick="stopVideo()">⏹</button>
  <input type="range" id="seek" min="0" max="100" value="0" step="0.1">
  <span id="seek-time">0:00 / 0:00</span>
</div>

<div id="output-wrap">
  <div id="output">파일을 업로드하면 여기에 ASCII 아트가 표시됩니다.</div>
</div>

<div id="status">대기 중 — python server.py 실행 필요</div>

<!-- 영상/GIF 프레임 추출용 (화면에 표시 안 됨) -->
<canvas id="canvas"></canvas>
<video  id="vid" muted playsinline loop></video>
<img    id="img-el">

<script>
const canvas  = document.getElementById('canvas');
const ctx     = canvas.getContext('2d', { willReadFrequently: true });
const vidEl   = document.getElementById('vid');
const imgEl   = document.getElementById('img-el');
const output  = document.getElementById('output');
const statusEl= document.getElementById('status');

let mode        = null;   // 'image' | 'gif' | 'video'
let raf         = null;   // requestAnimationFrame ID
let sending     = false;  // 서버 요청 중복 방지 플래그
let paused      = false;  // 일시정지 상태
let currentFile = null;   // 영상 저장용 원본 파일 참조

// ── 슬라이더·체크박스 값 읽기 ───────────────────────
function p() {
  return {
    width:      +document.getElementById('c-width').value,
    contrast:   +document.getElementById('c-contrast').value,
    ratio:      +document.getElementById('c-ratio').value,
    canny_low:  +document.getElementById('c-edge').value,
    canny_high: +document.getElementById('c-edge').value * 3,
    invert:      document.getElementById('c-invert').checked,
    color:       document.getElementById('c-color').checked,
  };
}

// 슬라이더 값 변경 시 표시값 갱신 + 정적 이미지 즉시 재요청
[['width','c-width'],['contrast','c-contrast'],['ratio','c-ratio'],['edge','c-edge']].forEach(([id, ctrl]) => {
  document.getElementById(ctrl).addEventListener('input', function() {
    document.getElementById('v-' + id).textContent = this.value;
    if (mode === 'image') sendFrame();
  });
});

// 크기 슬라이더: CSS만 변경, 서버 요청 불필요
document.getElementById('c-size').addEventListener('input', function() {
  const sz = this.value;
  document.getElementById('v-size').textContent = sz;
  output.style.fontSize   = sz + 'px';
  output.style.lineHeight = (sz * 1.15) + 'px';
});

['c-invert','c-color'].forEach(id => {
  document.getElementById(id).addEventListener('change', () => { if (mode === 'image') sendFrame(); });
});

// ── 드롭존 ──────────────────────────────────────────
const drop = document.getElementById('drop-zone');
const fi   = document.getElementById('file-input');

drop.addEventListener('click', () => fi.click());
drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('drag-over'); });
drop.addEventListener('dragleave', () => drop.classList.remove('drag-over'));
drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('drag-over'); loadFile(e.dataTransfer.files[0]); });
fi.addEventListener('change', () => loadFile(fi.files[0]));

function loadFile(file) {
  if (!file) return;
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  currentFile = file;
  const url = URL.createObjectURL(file);
  const btnVideo = document.getElementById('btn-save-video');

  paused = false;
  if (file.type.startsWith('video/')) {
    mode = 'video';
    _showVideoControls(true);
    vidEl.src = url;
    vidEl.play();
    vidEl.addEventListener('loadeddata', startLoop, { once: true });
    statusEl.textContent = '영상: ' + file.name;
  } else if (file.type === 'image/gif') {
    mode = 'gif';
    _showVideoControls(true);
    imgEl.onload = startLoop;
    imgEl.src = url;
    statusEl.textContent = 'GIF: ' + file.name;
  } else {
    mode = 'image';
    _showVideoControls(false);
    imgEl.onload = () => sendFrame();
    imgEl.src = url;
    statusEl.textContent = '이미지: ' + file.name;
  }
}

const seekBar  = document.getElementById('seek-bar');
const seekEl   = document.getElementById('seek');
const seekTime = document.getElementById('seek-time');

// 시크바 드래그 → 영상 이동
seekEl.addEventListener('input', () => {
  if (mode !== 'video') return;
  vidEl.currentTime = (seekEl.value / 100) * vidEl.duration;
});

// 영상 재생 중 시크바 자동 업데이트
vidEl.addEventListener('timeupdate', () => {
  if (mode !== 'video' || !vidEl.duration) return;
  seekEl.value = (vidEl.currentTime / vidEl.duration) * 100;
  seekTime.textContent = _fmt(vidEl.currentTime) + ' / ' + _fmt(vidEl.duration);
});

function _fmt(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60).toString().padStart(2, '0');
  return m + ':' + s;
}

function _showVideoControls(show) {
  document.getElementById('btn-save-video').style.display = show ? '' : 'none';
  const isVideo = show && mode === 'video';
  seekBar.style.display = isVideo ? 'flex' : 'none';
  if (!show) return;
  document.getElementById('btn-playpause').textContent = '⏸';
}

function togglePause() {
  const btn = document.getElementById('btn-playpause');
  paused = !paused;
  if (paused) {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    if (mode === 'video') vidEl.pause();
    btn.textContent = '▶';
    statusEl.textContent = '일시정지';
  } else {
    if (mode === 'video') vidEl.play();
    startLoop();
    btn.textContent = '⏸';
    statusEl.textContent = '재생 중';
  }
}

function stopVideo() {
  if (raf) { cancelAnimationFrame(raf); raf = null; }
  paused = false;
  vidEl.pause();
  vidEl.currentTime = 0;
  output.textContent = '정지됨';
  statusEl.textContent = '정지';
  _showVideoControls(false);
  mode = null;
  currentFile = null;
}

// GIF·영상은 매 프레임마다 서버로 전송
function startLoop() {
  function loop() {
    if (!paused) sendFrame();
    raf = requestAnimationFrame(loop);
  }
  loop();
}

// ── 핵심: 현재 프레임을 캔버스에서 추출 → 서버로 전송 → ASCII 수신 ──
async function sendFrame() {
  if (sending) return; // 이전 요청이 처리 중이면 건너뜀
  const src  = (mode === 'video') ? vidEl : imgEl;
  const srcW = src.videoWidth  || src.naturalWidth;
  const srcH = src.videoHeight || src.naturalHeight;
  if (!srcW || !srcH) return;

  const params   = p();
  const width    = params.width;
  const height   = Math.max(1, Math.round(width * (srcH / srcW) * params.ratio));

  // 오프스크린 캔버스에 현재 프레임 그리기
  canvas.width  = srcW;
  canvas.height = srcH;
  ctx.drawImage(src, 0, 0);

  sending = true;
  try {
    // 캔버스를 JPEG blob으로 변환 후 FormData에 담아 서버 전송
    const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.85));
    const form = new FormData();
    form.append('file',       blob, 'frame.jpg');
    form.append('width',      width);
    form.append('contrast',   params.contrast);
    form.append('ratio',      params.ratio);
    form.append('invert',     params.invert);
    form.append('canny_low',  params.canny_low);
    form.append('canny_high', params.canny_high);
    form.append('color',      params.color);

    const res  = await fetch('/api/convert', { method: 'POST', body: form });
    const data = await res.json();

    if (data.error) {
      statusEl.textContent = '오류: ' + data.error;
      return;
    }
    displayAscii(data);
    if (mode === 'image') statusEl.textContent = '변환 완료';

  } catch (e) {
    statusEl.textContent = '서버 연결 실패 — python server.py 실행 확인';
  } finally {
    sending = false;
  }
}

// ── ASCII 결과 화면 출력 ─────────────────────────────
function displayAscii(data) {
  const { lines, colors } = data;

  if (!colors) {
    // 일반 모드: 순수 텍스트
    output.textContent = lines.join('\n');
    return;
  }

  // 컬러 모드: base64 RGB 데이터를 디코딩해 <span> 태그로 출력
  const bytes = Uint8Array.from(atob(colors), c => c.charCodeAt(0));
  const rows  = [];
  let pi = 0;
  for (const line of lines) {
    const parts = [];
    for (const ch of line) {
      const r = bytes[pi], g = bytes[pi+1], b = bytes[pi+2];
      pi += 3;
      const safe = ch === '<' ? '&lt;' : ch === '>' ? '&gt;' : ch === '&' ? '&amp;' : ch === ' ' ? '&nbsp;' : ch;
      parts.push(`<span style="color:rgb(${r},${g},${b})">${safe}</span>`);
    }
    rows.push(parts.join(''));
  }
  output.innerHTML = rows.join('\n');
}

// ── 파일 저장 ────────────────────────────────────────
function downloadTxt() {
  const text = output.textContent || output.innerText;
  if (!text.trim()) return;
  save('ascii.txt', 'text/plain', text);
}

function downloadHtml() {
  const inner = output.innerHTML || '';
  if (!inner.trim()) return;
  const html =
    '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' +
    'body{background:#000;margin:0}pre{font-family:monospace;font-size:10px;line-height:1.15;color:#fff}' +
    '</style></head><body><pre>' + inner + '</pre></body></html>';
  save('ascii.html', 'text/html', html);
}

async function saveVideo() {
  if (!currentFile) return;
  const params = p();
  const form = new FormData();
  form.append('file',       currentFile, currentFile.name);
  form.append('width',      params.width);
  form.append('contrast',   params.contrast);
  form.append('ratio',      params.ratio);
  form.append('invert',     params.invert);
  form.append('canny_low',  params.canny_low);
  form.append('canny_high', params.canny_high);
  form.append('color',      params.color);
  form.append('fps',        12);

  const btn = document.getElementById('btn-save-video');
  btn.textContent = '변환 중…';
  btn.disabled = true;
  statusEl.textContent = '영상 변환 중 — 영상 길이에 따라 시간이 걸립니다';

  try {
    const res = await fetch('/api/convert-video', { method: 'POST', body: form });
    if (!res.ok) {
      const err = await res.json();
      statusEl.textContent = '오류: ' + (err.error || res.status);
      return;
    }
    const blob = await res.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'ascii.mp4';
    a.click();
    statusEl.textContent = '영상 저장 완료';
  } catch (e) {
    statusEl.textContent = '서버 연결 실패';
  } finally {
    btn.textContent = '영상 저장';
    btn.disabled = false;
  }
}

function save(name, mime, content) {
  const a = document.createElement('a');
  a.href = 'data:' + mime + ';charset=utf-8,' + encodeURIComponent(content);
  a.download = name;
  a.click();
}
</script>
</body>
</html>
